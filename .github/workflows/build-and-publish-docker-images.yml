name: Build and push Docker images to Dockerhub

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.core
            tags: bitweb/ansible:latest,bitweb/ansible:1-core
            cache-key: core
          - dockerfile: Dockerfile.full
            tags: bitweb/ansible:1-full
            cache-key: full
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bitweb/ansible
          labels: |
            org.opencontainers.image.title=Ansible
            org.opencontainers.image.description=Ansible Docker image for CI pipelines
            org.opencontainers.image.vendor=Bitweb OÜ

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache-key }}
          cache-to: type=gha,scope=${{ matrix.cache-key }},mode=max
